# /etc/asound.conf — Low-Latency Direct ALSA dmix for DOSBox-X Kiosk (512-sample period)
pcm.!default {
    type plug
    slave.pcm "kiosk_dmix"
}

pcm.kiosk_dmix {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        period_time 0
        period_size 512
        buffer_size 2048
    }
}

ctl.!default {
    type hw
    card 0
}
