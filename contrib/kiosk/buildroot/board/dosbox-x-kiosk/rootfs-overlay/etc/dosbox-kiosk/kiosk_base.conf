# --- DOSBox-X Kiosk Appliance Base Configuration (Buildroot KMSDRM) ---
[sdl]
fullscreen          = true
fulldouble          = true
fullresolution      = desktop
output              = openglpp
autolock            = true
sensitivity         = 100
waitonerror         = false
mapperfile          = /var/lib/dosbox-kiosk/config/kiosk_mapper.map

[dosbox]
title               = DOSBox-X Kiosk Appliance
fastbioslogo        = true
startbanner         = false
quit warning        = false
working directory option = default

[render]
frameskip           = 0
aspect              = true
char9               = true
scaler              = none
glshader            = crt-aperture.glsl

[dos]
automount           = false
automountall        = false
mountwarning        = false
