# genimage.cfg — 3-Partition GPT Appliance Image for DOSBox-X Kiosk Edition
# Partition 1: 256 MB FAT32 EFI System Partition (GRUB2 EFI + kernel + tiny overlayroot initramfs)
# Partition 2: 1.5 GB Read-Only SquashFS RootFS (GPT PARTLABEL=KIOSK_ROOT)
# Partition 3: Writable Ext4 Persistent Data Partition (LABEL=KIOSK_DATA)

image efi-part.vfat {
    vfat {
        label = "KIOSK_ESP"
        file EFI/BOOT/BOOTX64.EFI {
            image = "efi-part/EFI/BOOT/bootx64.efi"
        }
        file EFI/BOOT/grub.cfg {
            image = "grub.cfg"
        }
        file bzImage {
            image = "bzImage"
        }
        file initramfs.cpio {
            image = "kiosk-initramfs.cpio"
        }
        file loader/entries/kiosk.conf {
            image = "kiosk.conf"
        }
    }
    size = 256M
}

image data-part.ext4 {
    ext4 {
        label = "KIOSK_DATA"
    }
    empty = true
    size = 1024M
}

image dosbox-x-kiosk-appliance.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition esp {
        partition-type-uuid = U
        bootable = "true"
        image = "efi-part.vfat"
    }

    partition KIOSK_ROOT {
        partition-type-uuid = L
        image = "rootfs.squashfs"
        size = 1536M
    }

    partition KIOSK_DATA {
        partition-type-uuid = L
        image = "data-part.ext4"
    }
}
